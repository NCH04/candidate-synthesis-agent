# Local one-command run:
#   docker compose up --build
# Then open http://localhost:7860
#
# Requires a .env file at the repo root with ANTHROPIC_API_KEY set
# (copy .env.example to .env).

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: candidate-synthesis-agent:local
    container_name: candidate-synthesis-agent
    env_file:
      - .env
    environment:
      # Override the default Claude model if you want:
      # CLAUDE_MODEL: claude-sonnet-4-6
      PYTHONUNBUFFERED: "1"
    ports:
      - "7860:7860"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; \
        sys.exit(0 if urllib.request.urlopen('http://localhost:7860/health').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
