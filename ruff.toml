line-length = 100
target-version = "py310"

[lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # long lines are already capped by line-length on format
    "B008",  # FastAPI's Depends()/File()/Form() defaults are the framework idiom
]

[lint.per-file-ignores]
"backend/tests/*" = ["E402"]  # conftest sets env vars before importing the app
